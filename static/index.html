<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投研大盘数据平台 · Market Data Platform</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell">
  <header class="topnav">
    <div class="brand"><div class="brand-mark"><i class="ti ti-chart-dots-3"></i></div><div><b>投研大盘数据平台</b><small>MARKET DATA PLATFORM</small></div></div>
    <nav class="mods" id="topMods">
      <div class="mod active" data-mod="overview"><i class="ti ti-layout-dashboard"></i>总览</div>
      <div class="mod" data-mod="collect"><i class="ti ti-database-import"></i>数据采集</div>
      <div class="mod" data-mod="derived"><i class="ti ti-calculator"></i>数据处理</div>
      <div class="mod" data-mod="dashboard"><i class="ti ti-chart-line"></i>数据看板</div>
      <div class="mod" data-mod="ops"><i class="ti ti-activity"></i>运维监控</div>
    </nav>
    <div class="spacer"></div>
    <div class="status"><span class="dot"></span><span id="hdStatus">系统正常</span></div>
    <div class="hd-chip"><i class="ti ti-clock" style="font-size:13px"></i> <span id="hdTime">--:--:--</span></div>
    <div class="hd-chip"><i class="ti ti-calendar-event" style="font-size:13px"></i> <span id="hdDate">--</span></div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="proto-banner"><i class="ti ti-database"></i><div><b>投研大盘数据平台</b> · 数据采集 / 处理 / 看板 / 监控一体化 · 数据实时读取自 SQLite 业务库</div><div class="spacer"></div><span class="ver" id="bannerDate">—</span></div>
      <div id="views"></div>
    </main>
  </div>
</div>
<div id="toastBox" class="toast-box"></div>
<div id="modalRoot"></div>
<script src="/static/echarts.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
